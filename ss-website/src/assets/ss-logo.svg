<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>SS — Struggle of Students</title>
  <rect width="128" height="128" rx="32" fill="#03045e"/>
  <!-- rising path behind the letters: the "struggle" curve that ends upward -->
  <path d="M14 98 C 38 104, 52 82, 66 74 S 98 58, 112 30" fill="none" stroke="#0077b6" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <!-- first S -->
  <path d="M58 40 C 58 30, 30 28, 30 43 C 30 58, 58 54, 58 70 C 58 86, 28 84, 28 74" fill="none" stroke="#caf0f8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- second S -->
  <path d="M98 40 C 98 30, 70 28, 70 43 C 70 58, 98 54, 98 70 C 98 86, 68 84, 68 74" fill="none" stroke="#48cae4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sprout: growth -->
  <path d="M114 14 C 101 12, 93 21, 96 31 C 108 31, 114 24, 114 14 Z" fill="#9fffcb"/>
  <path d="M96 31 C 100 26, 104 23, 109 20" fill="none" stroke="#25a18e" stroke-width="2.4" stroke-linecap="round"/>
</svg>
